[package]
name = "mosaic"
version = "0.1.0"
description = "Mosaic: A spatial canvas for AI conversations with branching, RAG semantic search, inline code execution (JS/Python via WASM), and multi-provider LLM support (Mistral, OpenAI, Anthropic, Gemini, Ollama)"
authors = ["Mosaic Contributors"]
edition = "2021"

[lib]
name = "mosaic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
